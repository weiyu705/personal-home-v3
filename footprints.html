(() => {
  const points = [...document.querySelectorAll('.city-point')];
  const controls = [...document.querySelectorAll('[data-city]')];
  const label = document.getElementById('selected-city-label');
  const status = document.getElementById('city-status');
  const map = document.querySelector('.china-map');
  const zoomButton = document.getElementById('zoom-city');
  let zoomed = false;
  let selectedPoint = points[0];
  function updateView() {
    const [x, y] = selectedPoint.getAttribute('transform').match(/[\d.]+/g).map(Number);
    const left = Math.max(0, Math.min(576, x - 192));
    const top = Math.max(0, Math.min(396, y - 132));
    map.setAttribute('viewBox', zoomed ? `${left} ${top} 384 264` : '0 0 960 660');
    zoomButton.setAttribute('aria-pressed', String(zoomed));
  }
  function selectCity(id) {
    const point = points.find(item => item.dataset.city === id);
    if (!point) return;
    const name = point.querySelector('title').textContent;
    selectedPoint = point;
    controls.forEach(item => {
      const selected = item.dataset.city === id;
      item.setAttribute('aria-pressed', String(selected));
      item.classList.toggle('is-selected', selected);
    });
    label.setAttribute('transform', point.getAttribute('transform'));
    label.setAttribute('x', '12');
    label.setAttribute('y', '-14');
    label.textContent = name;
    status.textContent = name + '，我去过的城市之一。';
    updateView();
  }
  controls.forEach(control => {
    control.addEventListener('click', () => selectCity(control.dataset.city));
    if (control.classList.contains('city-point')) {
      control.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectCity(control.dataset.city);
        }
      });
    }
  });
  zoomButton.addEventListener('click', () => { zoomed = true; updateView(); });
  document.getElementById('reset-map').addEventListener('click', () => { zoomed = false; updateView(); });
  selectCity('0');
})();
</script></body></html>
